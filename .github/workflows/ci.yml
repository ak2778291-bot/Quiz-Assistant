name: CI

on:
  # Both names: the repository's default branch is `master`, and a workflow
  # pinned to `main` alone would never run on push here — the spec's definition
  # of done is "tests pass in CI on push".
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edugen
          POSTGRES_PASSWORD: edugen
          POSTGRES_DB: edugen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edugen -d edugen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Enables the integration tests; without it they skip.
      TEST_DATABASE_URL: postgresql+asyncpg://edugen:edugen@localhost:5432/edugen_test
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: local
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app scripts tests

      - name: Tests (unit + integration)
        run: pytest -q

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
