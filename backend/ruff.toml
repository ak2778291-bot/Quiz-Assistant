line-length = 100
target-version = "py312"

exclude = [".venv", "__pycache__"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # long lines are mostly explanatory comments/prompts
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[lint.per-file-ignores]
"tests/*" = ["E402"]      # conftest must set env before importing app.*
"scripts/*" = ["E402"]    # sys.path bootstrap before app imports
